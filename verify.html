<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification | Medi Fella Beauty School</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4fbfd;color:#263746}
header{background:#fff;padding:18px 6%;display:flex;align-items:center;gap:14px;border-bottom:1px solid #e5eef1}
header img{width:55px;height:55px;object-fit:contain;border-radius:50%}
header strong{font-size:20px}
.container{max-width:750px;margin:60px auto;padding:20px}
.card{background:#fff;padding:35px;border-radius:20px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
h1{text-align:center;margin-bottom:10px}
.description{text-align:center;color:#687780;margin-bottom:30px}
.search{display:flex;gap:10px}
input{flex:1;padding:15px;border:1px solid #ccd9de;border-radius:10px;font-size:16px}
button{padding:15px 22px;border:none;border-radius:10px;background:#2aaec5;color:#fff;font-weight:bold;cursor:pointer}
.result{display:none;margin-top:30px;padding:25px;border-radius:15px}
.valid{display:block;background:#effaf5;border:1px solid #b8e4d1}
.invalid{display:block;background:#fff2f2;border:1px solid #edc1c1}
.student-photo{display:block;width:140px;height:170px;object-fit:cover;margin:0 auto 20px;border-radius:10px;border:3px solid #2aaec5}
.info{margin-top:15px}
.info-row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #e5eeee}
.label{font-weight:bold}
footer{text-align:center;padding:30px;color:#71808a}
@media(max-width:600px){.search{flex-direction:column}.info-row{flex-direction:column;gap:4px}}
</style>
</head>
<body>
<header>
<img src="logo.jpeg" alt="Medi Fella Beauty School">
<strong>Medi Fella Beauty School</strong>
</header>

<div class="container">
<div class="card">
<h1>Certificate Verification</h1>
<p class="description">Enter the certificate number printed on the certificate to verify its authenticity.</p>

<div class="search">
<input id="certificateId" type="text" placeholder="Example: MFS-2026-0001">
<button onclick="verifyCertificate()">Verify Certificate</button>
</div>

<div id="result" class="result"></div>
</div>
</div>

<footer>© 2026 Medi Fella Beauty School</footer>

<script>
async function verifyCertificate(){
const id=document.getElementById("certificateId").value.trim().toUpperCase();
const result=document.getElementById("result");

if(!id){
result.className="result invalid";
result.innerHTML="<strong>Please enter a certificate number.</strong>";
return;
}

try{
const response=await fetch("certificates.json?"+Date.now());
const certificates=await response.json();
const certificate=certificates.find(c=>c.id.toUpperCase()===id);

if(certificate){
result.className="result valid";
result.innerHTML=`
<h2 style="text-align:center;color:#238b68;">✓ Certificate Verified</h2>
<img class="student-photo" src="${certificate.photo}" alt="Student Photo">
<div class="info">
<div class="info-row"><span class="label">Student Name</span><span>${certificate.name}</span></div>
<div class="info-row"><span class="label">Certificate No.</span><span>${certificate.id}</span></div>
<div class="info-row"><span class="label">Course</span><span>${certificate.course}</span></div>
<div class="info-row"><span class="label">Duration</span><span>${certificate.duration}</span></div>
<div class="info-row"><span class="label">Issue Date</span><span>${certificate.issueDate}</span></div>
<div class="info-row"><span class="label">Completion Date</span><span>${certificate.completionDate}</span></div>
<div class="info-row"><span class="label">Status</span><span style="color:#238b68;font-weight:bold;">VALID</span></div>
</div>`;
}else{
result.className="result invalid";
result.innerHTML="<strong>Certificate Not Found</strong><p>Please check the certificate number and try again.</p>";
}
}catch(error){
result.className="result invalid";
result.innerHTML="<strong>Verification service unavailable.</strong><p>Please try again later.</p>";
}
}
</script>
</body>
</html>
