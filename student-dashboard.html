<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard | Medi Fella</title>
<link rel="stylesheet" href="student.css">
</head>

<body>

<header class="top">
  <a class="brand" href="index.html">Medi Fella Beauty School</a>
  <div>
    <b data-t="student">STUDENT AREA</b>
    <button onclick="setLang('km')">ខ្មែរ</button>
    <button onclick="setLang('en')">English</button>
    <button onclick="setLang('ko')">한국어</button>
    <button onclick="logout()" data-t="logout">LOGOUT</button>
  </div>
</header>

<main class="dash">

  <section class="welcome">
    <div>
      <span data-t="student">STUDENT AREA</span>
      <h1 data-t="welcome">Welcome to your classroom</h1>
      <p id="studentInfo"></p>
    </div>
  </section>

  <section class="course-card">
    <div class="course-head">
      <div>
        <span class="badge" data-t="active">ACTIVE COURSE</span>
        <h2 data-t="course">Facial Massage</h2>
      </div>
      <div>
        <strong id="progressText">0%</strong>
      </div>
    </div>

    <div id="lessons"></div>
  </section>

</main>

<script>
const T = {
  km: {
    student: "តំបន់សិស្ស",
    welcome: "សូមស្វាគមន៍មកកាន់ថ្នាក់រៀនរបស់អ្នក",
    active: "វគ្គសិក្សាកំពុងសិក្សា",
    course: "ម៉ាស្សាមុខ",
    logout: "ចាកចេញ",
    lesson: "មេរៀន",
    open: "បើកមេរៀន",
    completed: "បានបញ្ចប់"
  },
  en: {
    student: "STUDENT AREA",
    welcome: "Welcome to your classroom",
    active: "ACTIVE COURSE",
    course: "Facial Massage",
    logout: "LOGOUT",
    lesson: "Lesson",
    open: "OPEN LESSON",
    completed: "COMPLETED"
  },
  ko: {
    student: "학생 영역",
    welcome: "수업에 오신 것을 환영합니다",
    active: "수강 중인 과정",
    course: "페이셜 마사지",
    logout: "로그아웃",
    lesson: "레슨",
    open: "레슨 열기",
    completed: "완료"
  }
};

const lessons = [
  ["Basic of Facial Massage", "기본 페이셜 마사지", "ម៉ាស្សាមុខមូលដ្ឋាន", "lesson-1.html"],
  ["Basic of Facial Massage Service Preparation", "페이셜 마사지 서비스 준비", "ការរៀបចំសេវាម៉ាស្សាមុខ", "lesson-2.html"],
  ["Clients Selection and Facial Massage Products", "고객 선택 및 페이셜 마사지 제품", "ការជ្រើសរើសអតិថិជន និងផលិតផលម៉ាស្សាមុខ", "lesson-3.html"],
  ["Basic of Facial Cleansing", "기본 페이셜 클렌징", "ការសម្អាតមុខមូលដ្ឋាន", "lesson-4.html"],
  ["General Facial Massage", "일반 페이셜 마사지", "ម៉ាស្សាមុខទូទៅ", "lesson-5.html"]
];

function getStudent() {
  /*
    The new student-login.html saves studentName and studentEmail
    after successful email verification.

    We also keep support for the old mfStudent object so existing
    student accounts continue to work.
  */
  const oldStudent = JSON.parse(localStorage.getItem("mfStudent") || "null");

  if (oldStudent) return oldStudent;

  const name = localStorage.getItem("studentName") || "Student";
  const email = localStorage.getItem("studentEmail") || "";

  return {
    name: name,
    email: email
  };
}

function renderLessons(lang) {
  const done = JSON.parse(localStorage.getItem("mfDone") || "[]");
  const box = document.getElementById("lessons");

  box.innerHTML = "";

  lessons.forEach((item, index) => {
    const number = index + 1;
    const title =
      lang === "km" ? item[2] :
      lang === "ko" ? item[1] :
      item[0];

    const isDone = done.includes(number) || done.includes(String(number));

    const row = document.createElement("div");
    row.className = "lesson-row";

    row.innerHTML = `
      <div>
        <strong>${T[lang].lesson} ${number}: ${title}</strong>
        ${isDone ? `<span class="completed">${T[lang].completed}</span>` : ""}
      </div>
      <a class="lesson-button" href="${item[3]}">
        ${T[lang].open}
      </a>
    `;

    box.appendChild(row);
  });

  const completedCount = lessons.filter((_, i) =>
    done.includes(i + 1) || done.includes(String(i + 1))
  ).length;

  const progress = Math.round((completedCount / lessons.length) * 100);

  document.getElementById("progressText").textContent = progress + "%";
}

function setLang(lang) {
  localStorage.setItem("mfLang", lang);
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-t]").forEach(el => {
    const key = el.getAttribute("data-t");
    if (T[lang][key]) el.textContent = T[lang][key];
  });

  renderLessons(lang);
}

function logout() {
  localStorage.removeItem("mfStudent");
  localStorage.removeItem("studentName");
  localStorage.removeItem("studentEmail");
  location.href = "student-login.html";
}

/*
  IMPORTANT FIX:
  The dashboard no longer requires mfStudent to exist.
  It also accepts studentName/studentEmail created by the new
  Supabase email-verification login system.
*/
const student = getStudent();

document.getElementById("studentInfo").textContent =
  student.email
    ? `${student.name} • ${student.email}`
    : student.name;

setLang(localStorage.getItem("mfLang") || "km");
</script>

</body>
</html>
