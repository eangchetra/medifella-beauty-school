<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medi Fella Beauty School | Website Under Maintenance</title>
<style>
  :root{
    --teal:#075e66;
    --gold:#c9a24e;
    --bg:#f5f8f8;
    --text:#203a3d;
    --muted:#6c7b7d;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    background:linear-gradient(135deg,#f5f8f8,#eef5f5);
    color:var(--text);
    font-family:Arial,"Noto Sans",sans-serif;
  }
  .card{
    width:min(620px,100%);
    background:#fff;
    border:1px solid #dce7e8;
    border-radius:24px;
    padding:46px 34px;
    text-align:center;
    box-shadow:0 18px 50px rgba(7,94,102,.10);
  }
  .logo{
    width:92px;
    height:92px;
    object-fit:contain;
    margin:0 auto 20px;
  }
  h1{
    margin:0;
    color:var(--teal);
    font-size:30px;
    font-weight:900;
  }
  h2{
    margin:10px 0 18px;
    color:var(--gold);
    font-size:21px;
    font-weight:800;
  }
  p{
    margin:0 auto 28px;
    max-width:500px;
    color:var(--muted);
    font-size:16px;
    line-height:1.7;
  }
  .btn{
    display:inline-block;
    text-decoration:none;
    background:var(--teal);
    color:#fff;
    padding:14px 28px;
    border-radius:12px;
    font-size:16px;
    font-weight:800;
    box-shadow:0 8px 20px rgba(7,94,102,.18);
  }
  .btn:hover{filter:brightness(1.08)}
  .small{
    margin-top:24px;
    color:#8a9698;
    font-size:13px;
  }
</style>
</head>
<body>
  <main class="card">
    <div style="font-size:58px;margin-bottom:12px">🏫</div>
    <h1>MEDI FELLA BEAUTY SCHOOL</h1>
    <h2>Website Under Maintenance</h2>
    <p>
      Our website is currently under maintenance while we prepare the new
      Medi Fella Beauty School website. Please check back soon.
    </p>
    <a class="btn" href="https://medifellabeautyschool.com/verify.html">
      📜 Verify Certificate
    </a>
    <div class="small">Thank you for your patience.</div>
  </main>
</body>
</html>
