<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Medi Fella Beauty School</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:#f4fafb;
      font-family:Arial,"Noto Sans Khmer",sans-serif;
      color:#17384e;
    }
    .card{
      width:100%;
      max-width:460px;
      background:#fff;
      border:1px solid #d7e7ea;
      border-radius:18px;
      padding:32px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }
    h1{margin:0 0 8px;text-align:center;font-size:28px}
    .sub{text-align:center;color:#6c7f87;margin-bottom:26px}
    label{display:block;font-weight:700;margin:16px 0 7px}
    input{
      width:100%;
      padding:13px 14px;
      border:1px solid #cbdde1;
      border-radius:10px;
      font-size:16px;
      outline:none;
    }
    input:focus{border-color:#1598a6}
    button{
      width:100%;
      margin-top:22px;
      padding:14px;
      border:0;
      border-radius:10px;
      background:#1598a6;
      color:#fff;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
    }
    button:disabled{opacity:.6;cursor:not-allowed}
    #message{
      display:none;
      margin-top:18px;
      padding:13px;
      border-radius:10px;
      text-align:center;
      line-height:1.5;
    }
    .error{display:block!important;background:#fff0f0;color:#8b3b3b}
    .success{display:block!important;background:#eef9f2;color:#267044}
  </style>
</head>
<body>
  <div class="card">
    <h1>MEDI FELLA BEAUTY SCHOOL</h1>
    <div class="sub">Set a new password</div>

    <form id="resetForm">
      <label for="password">New Password</label>
      <input id="password" type="password" minlength="6" required
             placeholder="Enter new password">

      <label for="confirmPassword">Confirm New Password</label>
      <input id="confirmPassword" type="password" minlength="6" required
             placeholder="Confirm new password">

      <button id="submitBtn" type="submit">Update Password</button>
    </form>

    <div id="message"></div>
  </div>

<script>
/*
  IMPORTANT:
  Replace ONLY these two values with your Supabase project details.

  SUPABASE_URL:
  https://dwrpriwxbjgxpsvhclai.supabase.co

  SUPABASE_PUBLISHABLE_KEY:
  Paste your Supabase "Publishable key" here.
  DO NOT paste a secret/service_role key.
*/
const SUPABASE_URL = "https://dwrpriwxbjgxpsvhclai.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

const message = document.getElementById("message");
const form = document.getElementById("resetForm");
const button = document.getElementById("submitBtn");

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

if (SUPABASE_PUBLISHABLE_KEY.includes("PASTE_YOUR")) {
  showMessage(
    "Supabase publishable key is not configured yet. Please add the Publishable key to this file.",
    "error"
  );
  button.disabled = true;
} else {
  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password.length < 6) {
      showMessage("Password must be at least 6 characters.", "error");
      return;
    }

    if (password !== confirmPassword) {
      showMessage("The passwords do not match.", "error");
      return;
    }

    button.disabled = true;
    button.textContent = "Updating...";

    const { error } = await client.auth.updateUser({ password });

    if (error) {
      showMessage(error.message, "error");
      button.disabled = false;
      button.textContent = "Update Password";
      return;
    }

    showMessage(
      "Password updated successfully. You can now return to the Medi Fella Admin login page and sign in with your new password.",
      "success"
    );
    form.reset();
    button.textContent = "Password Updated";
  });
}
</script>
</body>
</html>
